<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Chat en Tiempo Real Seguro</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <h1>Chat</h1>
    
    <!-- PANTALLA DE AUTENTICACIÓN (LOGIN / REGISTRO) -->
    <div id="login-container">
        <div id="login-box">
            <h2>💬 Chat Seguro</h2>
            <p>Inicia sesión o crea una cuenta para comenzar</p>
            
            <!-- Pestañas de Auth -->
            <div id="auth-tabs">
                <button class="auth-tab active" id="tab-login">Iniciar Sesión</button>
                <button class="auth-tab" id="tab-register">Registrarse</button>
            </div>

            <!-- Formulario de Iniciar Sesión -->
            <form id="login-form">
                <div class="form-group">
                    <input type="email" id="login-email" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Contraseña" required>
                </div>
                <button type="submit" id="loginButton">Iniciar Sesión</button>
            </form>

            <!-- Formulario de Registro -->
            <form id="register-form" class="hidden">
                <div class="form-group">
                    <input type="text" id="register-displayname" placeholder="Nombre para mostrar" minlength="1" maxlength="50" required>
                </div>
                <div class="form-group">
                    <input type="email" id="register-email" placeholder="Correo electrónico" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" placeholder="Contraseña (mín. 6 caracteres)" minlength="6" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-confirm" placeholder="Confirmar contraseña" minlength="6" required>
                </div>
                <button type="submit" id="registerButton">Crear Cuenta</button>
            </form>

            <div id="auth-error" class="hidden"></div>
            <div id="auth-loading" class="hidden">
                <span class="spinner"></span> Autenticando...
            </div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL DEL CHAT -->
    <div id="chat-container" class="hidden">
        <div id="chat-wrapper">
            <aside id="sidebar">
                <section id="room-list">
                    <h2>Salas</h2>
                    <ul id="rooms">                        
                    </ul>
                </section>
                <section id="user-list-section">
                    <h2>Usuarios en Sala</h2>
                    <p class="sidebar-hint">Haz clic en un usuario para iniciar un chat privado WebRTC</p>
                    <ul id="users"></ul>
                </section>
                <section id="p2p-list-section" class="hidden">
                    <h2>Chats P2P Activos</h2>
                    <ul id="p2p-active-list"></ul>
                </section>
                <!-- Panel de Administración (visible solo para admin) -->
                <section id="admin-panel" class="hidden">
                    <h2>Panel Admin</h2>
                    <div id="admin-controls">
                        <label for="admin-user-select">Usuario:</label>
                        <select id="admin-user-select">
                            <option value="">Selecciona usuario...</option>
                        </select>
                        <label for="admin-role-select">Nuevo Rol:</label>
                        <select id="admin-role-select">
                            <option value="user">User</option>
                            <option value="moderator">Moderator</option>
                            <option value="admin">Admin</option>
                        </select>
                        <button id="adminChangeRoleButton">Asignar Rol</button>
                    </div>
                </section>
            </aside>
            
            <main id="chat-main">
                <div id="chat-header">
                    <div id="user-identity" class="hidden">
                        <span>Conectado como: <strong id="current-username"></strong></span>
                        <span id="current-user-role" class="role-badge role-user">user</span>
                        <button id="logoutButton">Cerrar Sesión</button>
                    </div>
                </div>
                <div id="messages"></div>
                
                <div id="input-area">
                    <div id="typing-indicator" class="hidden"></div>
                    <div id="message-input-wrapper">
                        <input type="text" id="messageInput" placeholder="Escribe tu mensaje...">
                        <button id="sendButton">Enviar</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para Chat Privado P2P -->
    <div id="p2p-modal" class="hidden">
        <div id="p2p-window">
            <div id="p2p-header">
                <h3>Chat Privado P2P: <span id="p2p-target-name"></span></h3>
                <div class="p2p-controls">
                    <span id="p2p-status" class="status-connecting">Conectando...</span>
                    <button id="closeP2P">×</button>
                </div>
            </div>
            <div id="p2p-messages"></div>
            <div id="p2p-input-area">
                <input type="text" id="p2pMessageInput" placeholder="Escribe un mensaje privado P2P...">
                <button id="p2pSendButton">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Contenedor para notificaciones flotantes -->
    <div id="notifications-container"></div>
    
    <!-- Dependencias del cliente y SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script type="module" src="js/chat.js"></script>
</body>
</html>
